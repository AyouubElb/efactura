# The API on Render, created once with New → Blueprint.
# This file wins over the dashboard. Secrets are typed into Render, never written here.
services:
  - type: web
    name: efactura-api
    runtime: node
    plan: free
    region: frankfurt
    # npx pins pnpm, Render's own can't be replaced; --prod=false keeps the build tools
    # api... builds the shared package first
    buildCommand: npx --yes pnpm@12.6.0 install --frozen-lockfile --prod=false && npx --yes pnpm@12.6.0 --filter api... build
    startCommand: node apps/api/dist/main.js
    healthCheckPath: /health
    # GitHub's checks apply the migrations, so Render waits for them
    autoDeployTrigger: checksPass
    # Only changes that reach the API start a deploy
    buildFilter:
      paths:
        - apps/api/**
        - packages/**
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - .node-version
        - render.yaml
    envVars:
      - key: NODE_ENV
        value: production
      # efactura_app on Neon's -pooler host, ending ?sslmode=verify-full
      - key: DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      # Copied to Vercel with the web app
      - key: INTERNAL_API_KEY
        generateValue: true
      - key: LINK_SECRET
        generateValue: true
      # Redis Cloud, Frankfurt: the email queue
      - key: REDIS_URL
        sync: false
      # smtps://resend:<API key>@smtp.resend.com:465
      - key: SMTP_URL
        sync: false
      # Resend's test sender until the shop's domain is verified
      - key: EMAIL_FROM
        value: eFactura <onboarding@resend.dev>
      # The web app's address, for the links in emails
      - key: APP_URL
        sync: false
      # The Resend account's own address, while the test sender is used
      - key: EMAIL_REDIRECT_TO
        sync: false
      # Cloudflare R2: https://<account id>.r2.cloudflarestorage.com
      - key: S3_ENDPOINT
        sync: false
      - key: S3_BUCKET
        value: efactura
      # An R2 token limited to that bucket, object read and write
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
