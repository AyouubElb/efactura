# Local development only — stand-ins for the cloud services
name: efactura

services:
  postgres: # replaces Neon
    image: postgres:17
    environment:
      POSTGRES_USER: efactura
      POSTGRES_PASSWORD: efactura
      POSTGRES_DB: efactura
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro # runs once, on an empty database
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U efactura -d efactura"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis: # replaces Redis Cloud — the BullMQ queue
    image: redis:7
    ports:
      - "6380:6379" # 6380 on the host, so it never clashes with a Redis already installed on the PC
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit: # replaces Resend — every email lands in a local inbox
    image: axllent/mailpit
    ports:
      - "1025:1025" # SMTP — the API sends here
      - "8025:8025" # the inbox, in the browser: http://localhost:8025

  s3proxy: # replaces Cloudflare R2 — speaks S3 and keeps the files in a volume
    image: andrewgaul/s3proxy
    environment:
      S3PROXY_IDENTITY: local # S3_ACCESS_KEY_ID in .env
      S3PROXY_CREDENTIAL: local-secret # S3_SECRET_ACCESS_KEY in .env
      # The browser sends a supplier invoice straight here with its upload link
      S3PROXY_CORS_ALLOW_ORIGINS: http://localhost:3000
      S3PROXY_CORS_ALLOW_METHODS: PUT
      S3PROXY_CORS_ALLOW_HEADERS: Content-Type
    ports:
      - "8080:80"
    volumes:
      - storage-data:/data # one folder per bucket, one file per key

volumes:
  postgres-data:
  storage-data:
