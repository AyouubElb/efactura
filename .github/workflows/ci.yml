name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      # The pnpm version comes from packageManager in package.json
      - uses: pnpm/action-setup@v6
        with:
          cache: true

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build

      # Render deploys only after this job passes, so the tables are ready first.
      # The owner key reaches only this step, and only on main.
      - name: Apply migrations to Neon
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: pnpm --filter api exec prisma migrate deploy
        env:
          MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
